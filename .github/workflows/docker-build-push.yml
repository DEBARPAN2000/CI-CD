name: Reusable Docker Build and Push

on:
  workflow_call:
    inputs:
      language:
        type: string
        default: auto
      registry:
        type: string
        default: ghcr.io
      image-owner:
        type: string
        default: ''
      image-name:
        type: string
        default: ''
      image-tag:
        type: string
        default: latest
      build-context:
        type: string
        default: .
      dockerfile-path:
        type: string
        default: ''
      dotnet-version:
        type: string
        default: '8.0'
      python-version:
        type: string
        default: '3.12'
      tag-latest:
        type: boolean
        default: true
        description: 'Also move the :latest tag (set false for PR/feature builds)'
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true
    outputs:
      image-ref:
        value: ${{ jobs.build.outputs.image-ref }}
      image-digest:
        value: ${{ jobs.build.outputs.image-digest }}
      detected-language:
        value: ${{ jobs.detect.outputs.language }}

permissions:
  contents: read
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      language: ${{ steps.detect.outputs.language }}
      dockerfile: ${{ steps.detect.outputs.dockerfile }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - if: ${{ inputs.dockerfile-path == '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.repository_owner }}/CI-CD
          path: .ci-cd-templates
      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          language='${{ inputs.language }}'
          dockerfile='${{ inputs.dockerfile-path }}'
          dotnet='false'
          python='false'

          if [ "$language" = 'dotnet' ]; then
            dotnet='true'
          elif [ "$language" = 'python' ]; then
            python='true'
          elif [ "$language" = 'both' ]; then
            dotnet='true'
            python='true'
          else
            if find . \( -name '*.sln' -o -name '*.csproj' -o -name 'global.json' -o -name 'Directory.Build.props' \) | grep -q .; then
              dotnet='true'
            fi
            if find . \( -name 'pyproject.toml' -o -name 'requirements*.txt' -o -name 'setup.py' -o -name 'setup.cfg' \) | grep -q .; then
              python='true'
            fi
          fi

          if [ -z "$dockerfile" ]; then
            if [ "$dotnet" = 'true' ]; then
              dockerfile='.ci-cd-templates/docker/Dockerfile.dotnet'
              language='dotnet'
            elif [ "$python" = 'true' ]; then
              dockerfile='.ci-cd-templates/docker/Dockerfile.python'
              language='python'
            else
              echo 'Unable to detect a supported stack.' >&2
              exit 1
            fi
          fi

          echo "language=$language" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$dockerfile" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    runs-on: ubuntu-latest
    outputs:
      image-ref: ${{ steps.meta.outputs.image-ref }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - if: ${{ inputs.dockerfile-path == '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.repository_owner }}/CI-CD
          path: .ci-cd-templates
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          image_name='${{ inputs.image-name }}'
          if [ -z "$image_name" ]; then
            image_name='${{ github.event.repository.name }}'
          fi
          registry='${{ inputs.registry }}'
          registry=$(printf '%s' "$registry" | tr '[:upper:]' '[:lower:]')
          image_owner='${{ inputs.image-owner }}'
          if [ -z "$image_owner" ] && [ "$registry" = 'ghcr.io' ]; then
            image_owner='${{ github.repository_owner }}'
          fi
          image_name=$(printf '%s' "$image_name" | tr '[:upper:]' '[:lower:]')
          image_owner=$(printf '%s' "$image_owner" | tr '[:upper:]' '[:lower:]')
          image_path="$image_name"
          if [ -n "$image_owner" ]; then
            image_path="${image_owner}/$image_name"
          fi
          echo "image-base=${registry}/$image_path" >> "$GITHUB_OUTPUT"
          echo "image-ref=${registry}/$image_path:${{ inputs.image-tag }}" >> "$GITHUB_OUTPUT"
          echo "image-name=$image_name" >> "$GITHUB_OUTPUT"
      - name: Login to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ${{ inputs.build-context }}
          file: ${{ needs.detect.outputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image-ref }}
            ${{ inputs.tag-latest && format('{0}:latest', steps.meta.outputs.image-base) || '' }}
          provenance: true
          sbom: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            DOTNET_VERSION=${{ inputs.dotnet-version }}
            PYTHON_VERSION=${{ inputs.python-version }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image-base }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.image-base }}:buildcache,mode=max
