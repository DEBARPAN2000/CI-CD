name: Reusable CI

on:
  workflow_call:
    inputs:
      language:
        type: string
        default: auto
      dotnet-version:
        type: string
        default: 8.0.x
      dotnet-project:
        type: string
        default: .
      dotnet-test-command:
        type: string
        default: ''
      python-version:
        type: string
        default: '3.12'
      python-workdir:
        type: string
        default: .
      python-install-command:
        type: string
        default: ''
      python-test-command:
        type: string
        default: ''
      lint-command:
        type: string
        default: ''
      run-sonarqube:
        type: boolean
        default: false
      sonar-project-key:
        type: string
        default: ''
      codeql-languages:
        type: string
        default: 'cpp,csharp,go,java,javascript,python,ruby'
    secrets:
      sonar-host-url:
        required: false
      sonar-token:
        required: false
    outputs:
      detected-language:
        value: ${{ jobs.detect.outputs.language }}
      sbom-artifact:
        value: ${{ jobs.sbom.outputs.sbom-file }}

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      language: ${{ steps.detect.outputs.language }}
      dotnet: ${{ steps.detect.outputs.dotnet }}
      python: ${{ steps.detect.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          language='${{ inputs.language }}'
          dotnet='false'
          python='false'

          if [ "$language" = 'dotnet' ]; then
            dotnet='true'
          elif [ "$language" = 'python' ]; then
            python='true'
          elif [ "$language" = 'both' ]; then
            dotnet='true'
            python='true'
          else
            if find . \( -name '*.sln' -o -name '*.csproj' -o -name 'global.json' -o -name 'Directory.Build.props' \) | grep -q .; then
              dotnet='true'
            fi
            if find . \( -name 'pyproject.toml' -o -name 'requirements*.txt' -o -name 'setup.py' -o -name 'setup.cfg' \) | grep -q .; then
              python='true'
            fi
            if [ "$dotnet" = 'false' ] && [ "$python" = 'false' ]; then
              echo 'No supported stack detected.' >&2
              exit 1
            fi
          fi

          if [ "$dotnet" = 'true' ] && [ "$python" = 'true' ]; then
            language='mixed'
          elif [ "$dotnet" = 'true' ]; then
            language='dotnet'
          else
            language='python'
          fi

          echo "language=$language" >> "$GITHUB_OUTPUT"
          echo "dotnet=$dotnet" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: ${{ inputs.codeql-languages }}
      - uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938

  sbom:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    outputs:
      sbom-file: sbom.json
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          format: cyclonedx-json
          output-file: sbom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 30

  dotnet:
    needs: detect
    if: needs.detect.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - shell: bash
        working-directory: ${{ inputs.dotnet-project }}
        run: dotnet restore
      - shell: bash
        working-directory: ${{ inputs.dotnet-project }}
        run: dotnet build --no-restore -c Release
      - shell: bash
        working-directory: ${{ inputs.dotnet-project }}
        run: |
          cmd="${{ inputs.dotnet-test-command }}"
          if [ -n "$cmd" ]; then
            bash -lc "$cmd"
          else
            dotnet test --no-build -c Release --collect:'XPlat Code Coverage'
          fi
      - if: ${{ inputs.lint-command != '' }}
        shell: bash
        run: ${{ inputs.lint-command }}
      - if: ${{ inputs.run-sonarqube }}
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_HOST_URL: ${{ secrets.sonar-host-url }}
          SONAR_TOKEN: ${{ secrets.sonar-token }}
        with:
          args: >
            -Dsonar.projectKey=${{ inputs.sonar-project-key }}
            -Dsonar.sources=.

  python:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ inputs.python-version }}
      - shell: bash
        working-directory: ${{ inputs.python-workdir }}
        run: |
          python -m pip install --upgrade pip
          if [ -n '${{ inputs.python-install-command }}' ]; then
            eval '${{ inputs.python-install-command }}'
          elif [ -f requirements-dev.txt ]; then
            pip install --only-binary :all: --require-hashes -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            pip install --only-binary :all: --require-hashes -r requirements.txt
          else
            pip install --only-binary :all: --require-hashes -e .
          fi
      - shell: bash
        working-directory: ${{ inputs.python-workdir }}
        run: |
          if [ -n '${{ inputs.python-test-command }}' ]; then
            eval '${{ inputs.python-test-command }}'
          else
            pytest
          fi
      - if: ${{ inputs.lint-command != '' }}
        shell: bash
        run: ${{ inputs.lint-command }}
      - if: ${{ inputs.run-sonarqube }}
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_HOST_URL: ${{ secrets.sonar-host-url }}
          SONAR_TOKEN: ${{ secrets.sonar-token }}
        with:
          args: >
            -Dsonar.projectKey=${{ inputs.sonar-project-key }}
            -Dsonar.sources=.
