name: Reusable DAST and Smoke Checks

on:
  workflow_call:
    inputs:
      target-url:
        type: string
        required: true
      dast-threshold:
        type: string
        default: medium
        description: 'Minimum severity to block: low, medium, high, critical'
      smoke-endpoints:
        type: string
        default: /health
        description: 'Comma-separated list of endpoints to smoke-test'
      image-ref:
        type: string
        default: ''
        description: 'If set, the app is started from this image via compose before scanning (needed when the target is not already reachable from this runner)'
      compose-file:
        type: string
        default: docker-compose.staging.yml
      compose-service:
        type: string
        default: app
      tls-cert:
        type: boolean
        default: false
        description: 'Generate ./certs/{cert,key}.pem for HTTPS apps'
    secrets:
      DAST_USERNAME:
        required: false
      DAST_PASSWORD:
        required: false

jobs:
  dast:
    runs-on: ubuntu-latest
    name: Smoke Tests and DAST (OWASP ZAP)
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Create local TLS certificate
        if: ${{ inputs.tls-cert }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p certs
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 -keyout certs/key.pem -out certs/cert.pem \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          chmod 644 certs/key.pem certs/cert.pem

      - name: Start app
        if: ${{ inputs.image-ref != '' }}
        shell: bash
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
          COMPOSE_SERVICE: ${{ inputs.compose-service }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          docker pull "$IMAGE_REF"
          docker compose -f "$COMPOSE_FILE" down || true
          docker compose -f "$COMPOSE_FILE" up -d "$COMPOSE_SERVICE"

      - name: Test health endpoints
        shell: bash
        env:
          TARGET_URL: ${{ inputs.target-url }}
          ENDPOINTS: ${{ inputs.smoke-endpoints }}
        run: |
          set -euo pipefail

          echo "Waiting for ${TARGET_URL} to be responsive..."
          for i in $(seq 1 12); do
            if curl -fsSk "${TARGET_URL}/health" >/dev/null 2>&1; then
              echo "✓ Target is responsive"
              break
            fi

            if [ "$i" -lt 12 ]; then
              echo "  Attempt ${i}/12, retrying in 5s..."
              sleep 5
            else
              echo "✗ Target failed to respond after 60s" >&2
              exit 1
            fi
          done

          if [ -z "${ENDPOINTS}" ]; then
            echo "No smoke endpoints configured."
            exit 0
          fi

          IFS=',' read -ra ENDPOINT_ARRAY <<< "${ENDPOINTS}"
          for endpoint in "${ENDPOINT_ARRAY[@]}"; do
            endpoint="$(echo "${endpoint}" | xargs)"
            if [ -z "${endpoint}" ]; then
              continue
            fi

            echo "Testing ${endpoint}..."
            response_code="$(curl -sSk -o /dev/null -w '%{http_code}' "${TARGET_URL}${endpoint}")"
            if [ "${response_code}" -ge 200 ] && [ "${response_code}" -lt 400 ]; then
              echo "  ✓ ${endpoint}: HTTP ${response_code}"
            else
              echo "  ✗ ${endpoint}: HTTP ${response_code}" >&2
              exit 1
            fi
          done

      - name: Run OWASP ZAP scan
        shell: bash
        env:
          TARGET_URL: ${{ inputs.target-url }}
        run: |
          set -euo pipefail
          echo "Starting OWASP ZAP scan of ${TARGET_URL}..."

          # --network host lets ZAP reach an app published on the runner's localhost.
          # Call the scripts directly (no login shell: `bash -lc` resets PATH and hides /zap/*.py).
          # Scan findings are gated by the "Parse and gate on findings" step, so scan exit codes are ignored.
          chmod a+w "$PWD"  # the zap user in the container must be able to write reports
          zap() { docker run --rm --network host -v "$PWD:/zap/wrk" ghcr.io/zaproxy/zaproxy:stable "$@" || true; }
          zap zap-baseline.py -t "$TARGET_URL" -J baseline-report.json
          zap zap-full-scan.py -t "$TARGET_URL" -T 10 -J zap-report.json -r zap-report.html

          cat > /tmp/zap_to_sarif.py <<'PY'
          import json
          import sys

          target_url = sys.argv[1]

          with open('zap-report.json', 'r', encoding='utf-8') as f:
              zap_data = json.load(f)

          sarif_output = {
              'version': '2.1.0',
              'runs': [{
                  'tool': {
                      'driver': {
                          'name': 'OWASP ZAP',
                          'informationUri': 'https://www.zaproxy.org'
                      }
                  },
                  'results': []
              }]
          }

          for alert in zap_data.get('site', [{}])[0].get('alerts', []):
              risk_code = int(alert.get('riskcode', 0))
              severity_map = {0: 'note', 1: 'warning', 2: 'error', 3: 'error', 4: 'error'}
              result = {
                  'ruleId': str(alert.get('pluginid', 'unknown')),
                  'message': {'text': alert.get('name', 'Unknown Alert')},
                  'level': severity_map.get(risk_code, 'warning'),
                  'locations': [{
                      'physicalLocation': {
                          'artifactLocation': {'uri': target_url},
                          'address': {'uri': target_url}
                      }
                  }]
              }
              sarif_output['runs'][0]['results'].append(result)

          with open('zap-report.sarif', 'w', encoding='utf-8') as f:
              json.dump(sarif_output, f, indent=2)
          PY

          python3 /tmp/zap_to_sarif.py "$TARGET_URL"

      - name: Upload OWASP ZAP reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zap-scan-reports
          path: |
            baseline-report.json
            zap-report.json
            zap-report.html
            zap-report.sarif
          if-no-files-found: ignore
          retention-days: 30

      - name: Parse and gate on findings
        shell: bash
        env:
          THRESHOLD: ${{ inputs.dast-threshold }}
        run: |
          set -euo pipefail

          if [ ! -f zap-report.json ]; then
            echo "Missing zap-report.json; scan did not complete."
            exit 1
          fi

          echo "DAST Threshold: ${THRESHOLD}"
          echo ""

          cat > /tmp/check_zap_threshold.py <<'PY'
          import json
          import os
          import sys

          threshold = os.environ.get('THRESHOLD', 'medium').lower()
          severity_order = ['info', 'low', 'medium', 'high', 'critical']
          threshold_level = severity_order.index(threshold) if threshold in severity_order else severity_order.index('medium')

          with open('zap-report.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          severity_counts = {sev: 0 for sev in severity_order}
          for alert in data.get('site', [{}])[0].get('alerts', []):
              risk_code = int(alert.get('riskcode', 0))
              severity_map = {0: 'info', 1: 'low', 2: 'medium', 3: 'high', 4: 'critical'}
              severity = severity_map.get(risk_code, 'info')
              severity_counts[severity] += 1
              print(f"  [{severity.upper()}] {alert.get('name', 'Unknown Alert')}")

          print('\nFindings Summary:')
          for sev in severity_order:
              print(f"  {sev.capitalize()}: {severity_counts[sev]}")

          blocking_severities = severity_order[threshold_level:]
          blocking_count = sum(severity_counts[s] for s in blocking_severities)
          if blocking_count > 0:
              print(f"\n✗ DAST scan FAILED: {blocking_count} finding(s) at or above threshold")
              sys.exit(1)

          print('\n✓ DAST scan PASSED')
          PY

          THRESHOLD="${THRESHOLD}" python3 /tmp/check_zap_threshold.py

      - name: Upload to GitHub Security
        if: ${{ always() && hashFiles('zap-report.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          sarif_file: zap-report.sarif
          category: 'DAST-OWASP-ZAP'
