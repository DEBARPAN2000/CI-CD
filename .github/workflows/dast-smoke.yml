name: Reusable DAST and Smoke Checks

on:
  workflow_call:
    inputs:
      target-url:
        type: string
        required: true
      dast-threshold:
        type: string
        default: medium
        description: 'Minimum severity to block: low, medium, high, critical'
      smoke-endpoints:
        type: string
        default: /health
        description: 'Comma-separated list of endpoints to smoke-test'
      images:
        type: string
        default: ''
        description: >-
          JSON array of images (same schema as docker-build-push.yml). When set, every entry with role
          "service" is pulled and started together via compose (IMAGE_REF_<NAME> is exported for each)
          before scanning target-url. Use it with registry, image-owner and image-tag.
      registry:
        type: string
        default: ghcr.io
        description: 'Registry of the images entries (multi-image mode)'
      image-owner:
        type: string
        default: ''
        description: 'Registry owner of the images entries; defaults to the repository owner on ghcr.io'
      image-tag:
        type: string
        default: ''
        description: 'Tag shared by the images entries; defaults to the commit SHA'
      image-ref:
        type: string
        default: ''
        description: 'If set, the app is started from this image via compose before scanning (needed when the target is not already reachable from this runner)'
      compose-file:
        type: string
        default: docker-compose.staging.yml
      compose-service:
        type: string
        default: app
        description: 'Single-image mode only; in multi-image mode use compose-service per images entry (defaults to the image name)'
      tls-cert:
        type: boolean
        default: false
        description: 'Generate ./certs/{cert,key}.pem for HTTPS apps'
    secrets:
      DAST_USERNAME:
        required: false
      DAST_PASSWORD:
        required: false

jobs:
  dast:
    runs-on: ubuntu-latest
    name: Smoke Tests and DAST (OWASP ZAP)
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Create local TLS certificate
        if: ${{ inputs.tls-cert }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p certs
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 -keyout certs/key.pem -out certs/cert.pem \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          chmod 644 certs/key.pem certs/cert.pem

      - name: Resolve image references
        if: ${{ inputs.image-ref != '' || inputs.images != '' }}
        id: resolve-image
        shell: bash
        env:
          IMAGES_INPUT: ${{ inputs.images }}
          IMAGE_REF: ${{ inputs.image-ref }}
          IMAGE_NAME: ${{ inputs.image-name }}
          IMAGE_OWNER: ${{ inputs.image-owner }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          REGISTRY: ${{ inputs.registry }}
          COMPOSE_SERVICE: ${{ inputs.compose-service }}
          HEALTH_URL: ''
          REQUIRE_HEALTH: 'false'
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          registry=$(lower "$REGISTRY")
          owner="$IMAGE_OWNER"
          if [ -z "$owner" ] && [ "$registry" = 'ghcr.io' ]; then
            owner="$REPO_OWNER"
          fi
          owner=$(lower "$owner")
          tag="${IMAGE_TAG:-$SHA}"

          if [ -n "$IMAGES_INPUT" ]; then
            # Multi-image mode: every role=service entry becomes one deployable service.
            services=$(printf '%s' "$IMAGES_INPUT" | jq -c \
              --arg registry "$registry" --arg owner "$owner" --arg tag "$tag" --arg require_health "$REQUIRE_HEALTH" '
              if type != "array" then error("images must be a JSON array") else . end
              | map(select((.role // "batch") == "service")
                  | ((.name // "") | ascii_downcase) as $name
                  | if ($name | test("^[a-z0-9][a-z0-9._-]*$")) | not then error("invalid image name: \"" + $name + "\"") else . end
                  | {
                      name: $name,
                      key: ($name | ascii_upcase | gsub("[^A-Z0-9]"; "_")),
                      ref: ($registry + "/" + (if $owner != "" then $owner + "/" else "" end) + $name + ":" + $tag),
                      registry: $registry,
                      service: (.["compose-service"] // $name),
                      health: (.["health-url"] // "")
                    }
                  | if $require_health == "true" and .health == "" then error("service image " + .name + " needs a health-url") else . end)
              | if length == 0 then error("images contains no role=service entry") else . end
              | if (map(.name) | unique | length) != length then error("image names must be unique") else . end')
          else
            # Single-image mode: one service, exactly as before.
            if [ -n "$IMAGE_REF" ]; then
              image_ref="$IMAGE_REF"
              registry=$(lower "${image_ref%%/*}")
            else
              image_name=$(lower "${IMAGE_NAME:-$REPO_NAME}")
              image_path="$image_name"
              if [ -n "$owner" ]; then
                image_path="${owner}/$image_name"
              fi
              image_ref="${registry}/${image_path}:${tag}"
            fi
            services=$(jq -cn --arg name "$(lower "${IMAGE_NAME:-$REPO_NAME}")" --arg ref "$image_ref" --arg registry "$registry" \
              --arg service "$COMPOSE_SERVICE" --arg health "$HEALTH_URL" \
              '[{name: $name, key: ($name | ascii_upcase | gsub("[^A-Z0-9]"; "_")), ref: $ref, registry: $registry, service: $service, health: $health}]')
          fi

          {
            echo "services=$services"
            echo "ghcr=$(printf '%s' "$services" | jq 'any(.[]; .registry == "ghcr.io")')"
            # First service's ref; keeps single-image consumers working (outputs may be dropped if they match a secret).
            echo "image-ref=$(printf '%s' "$services" | jq -r '.[0].ref')"
          } >> "$GITHUB_OUTPUT"
          printf '%s' "$services" | jq -r '.[] | "  - \(.name) -> \(.ref) (compose service: \(.service))"'

      - name: Start app
        if: ${{ inputs.image-ref != '' || inputs.images != '' }}
        shell: bash
        env:
          SERVICES: ${{ steps.resolve-image.outputs.services }}
          COMPOSE_FILE: ${{ inputs.compose-file }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$(jq 'any(.[]; .registry == "ghcr.io")' <<< "$SERVICES")" = 'true' ]; then
            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          fi
          while read -r key ref; do
            docker pull "$ref"
            export "IMAGE_REF_${key}=${ref}"
          done < <(jq -r '.[] | "\(.key) \(.ref)"' <<< "$SERVICES")
          if [ "$(jq 'length' <<< "$SERVICES")" = '1' ]; then
            export IMAGE_REF="$(jq -r '.[0].ref' <<< "$SERVICES")"
          fi
          mapfile -t compose_services < <(jq -r '.[].service' <<< "$SERVICES" | sort -u)
          docker compose -f "$COMPOSE_FILE" down || true
          docker compose -f "$COMPOSE_FILE" up -d "${compose_services[@]}"

      - name: Test health endpoints
        shell: bash
        env:
          TARGET_URL: ${{ inputs.target-url }}
          ENDPOINTS: ${{ inputs.smoke-endpoints }}
        run: |
          set -euo pipefail

          echo "Waiting for ${TARGET_URL} to be responsive..."
          for i in $(seq 1 12); do
            if curl -fsSk "${TARGET_URL}/health" >/dev/null 2>&1; then
              echo "✓ Target is responsive"
              break
            fi

            if [ "$i" -lt 12 ]; then
              echo "  Attempt ${i}/12, retrying in 5s..."
              sleep 5
            else
              echo "✗ Target failed to respond after 60s" >&2
              exit 1
            fi
          done

          if [ -z "${ENDPOINTS}" ]; then
            echo "No smoke endpoints configured."
            exit 0
          fi

          IFS=',' read -ra ENDPOINT_ARRAY <<< "${ENDPOINTS}"
          for endpoint in "${ENDPOINT_ARRAY[@]}"; do
            endpoint="$(echo "${endpoint}" | xargs)"
            if [ -z "${endpoint}" ]; then
              continue
            fi

            echo "Testing ${endpoint}..."
            response_code="$(curl -sSk -o /dev/null -w '%{http_code}' "${TARGET_URL}${endpoint}")"
            if [ "${response_code}" -ge 200 ] && [ "${response_code}" -lt 400 ]; then
              echo "  ✓ ${endpoint}: HTTP ${response_code}"
            else
              echo "  ✗ ${endpoint}: HTTP ${response_code}" >&2
              exit 1
            fi
          done

      - name: Run OWASP ZAP scan
        shell: bash
        env:
          TARGET_URL: ${{ inputs.target-url }}
          LOCATION_URI: ${{ inputs.compose-file }}
        run: |
          set -euo pipefail
          echo "Starting OWASP ZAP scan of ${TARGET_URL}..."

          # --network host lets ZAP reach an app published on the runner's localhost.
          # Call the scripts directly (no login shell: `bash -lc` resets PATH and hides /zap/*.py).
          # Scan findings are gated by the "Parse and gate on findings" step, so scan exit codes are ignored.
          chmod a+w "$PWD"  # the zap user in the container must be able to write reports
          zap() { docker run --rm --network host -v "$PWD:/zap/wrk" ghcr.io/zaproxy/zaproxy:stable "$@" || true; }
          zap zap-baseline.py -t "$TARGET_URL" -J baseline-report.json
          zap zap-full-scan.py -t "$TARGET_URL" -T 10 -J zap-report.json -r zap-report.html

          cat > /tmp/zap_to_sarif.py <<'PY'
          import json
          import os
          import sys

          target_url = sys.argv[1]
          # Code scanning needs a repo-relative file; anchor findings to the deployment file.
          location_uri = os.environ['LOCATION_URI']

          with open('zap-report.json', 'r', encoding='utf-8') as f:
              zap_data = json.load(f)

          sarif_output = {
              'version': '2.1.0',
              'runs': [{
                  'tool': {
                      'driver': {
                          'name': 'OWASP ZAP',
                          'informationUri': 'https://www.zaproxy.org'
                      }
                  },
                  'results': []
              }]
          }

          for alert in zap_data.get('site', [{}])[0].get('alerts', []):
              risk_code = int(alert.get('riskcode', 0))
              severity_map = {0: 'note', 1: 'warning', 2: 'error', 3: 'error', 4: 'error'}
              result = {
                  'ruleId': str(alert.get('pluginid', 'unknown')),
                  'message': {'text': f"{alert.get('name', 'Unknown Alert')} ({target_url})"},
                  'level': severity_map.get(risk_code, 'warning'),
                  'locations': [{
                      'physicalLocation': {
                          'artifactLocation': {'uri': location_uri}
                      }
                  }]
              }
              sarif_output['runs'][0]['results'].append(result)

          with open('zap-report.sarif', 'w', encoding='utf-8') as f:
              json.dump(sarif_output, f, indent=2)
          PY

          python3 /tmp/zap_to_sarif.py "$TARGET_URL"

      - name: Upload OWASP ZAP reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zap-scan-reports
          path: |
            baseline-report.json
            zap-report.json
            zap-report.html
            zap-report.sarif
          if-no-files-found: ignore
          retention-days: 30

      - name: Parse and gate on findings
        shell: bash
        env:
          THRESHOLD: ${{ inputs.dast-threshold }}
        run: |
          set -euo pipefail

          if [ ! -f zap-report.json ]; then
            echo "Missing zap-report.json; scan did not complete."
            exit 1
          fi

          echo "DAST Threshold: ${THRESHOLD}"
          echo ""

          cat > /tmp/check_zap_threshold.py <<'PY'
          import json
          import os
          import sys

          threshold = os.environ.get('THRESHOLD', 'medium').lower()
          severity_order = ['info', 'low', 'medium', 'high', 'critical']
          threshold_level = severity_order.index(threshold) if threshold in severity_order else severity_order.index('medium')

          with open('zap-report.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          severity_counts = {sev: 0 for sev in severity_order}
          for alert in data.get('site', [{}])[0].get('alerts', []):
              risk_code = int(alert.get('riskcode', 0))
              severity_map = {0: 'info', 1: 'low', 2: 'medium', 3: 'high', 4: 'critical'}
              severity = severity_map.get(risk_code, 'info')
              severity_counts[severity] += 1
              print(f"  [{severity.upper()}] {alert.get('name', 'Unknown Alert')}")

          print('\nFindings Summary:')
          for sev in severity_order:
              print(f"  {sev.capitalize()}: {severity_counts[sev]}")

          blocking_severities = severity_order[threshold_level:]
          blocking_count = sum(severity_counts[s] for s in blocking_severities)
          if blocking_count > 0:
              print(f"\n✗ DAST scan FAILED: {blocking_count} finding(s) at or above threshold")
              sys.exit(1)

          print('\n✓ DAST scan PASSED')
          PY

          THRESHOLD="${THRESHOLD}" python3 /tmp/check_zap_threshold.py

      - name: Upload to GitHub Security
        if: ${{ always() && hashFiles('zap-report.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          sarif_file: zap-report.sarif
          category: 'DAST-OWASP-ZAP'
