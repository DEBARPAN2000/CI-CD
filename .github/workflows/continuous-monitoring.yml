name: Reusable Continuous Monitoring

on:
  workflow_call:
    inputs:
      images:
        type: string
        default: ''
        description: >-
          JSON array of images (same schema as docker-build-push.yml). Every entry with role "service" is
          monitored at its own health-url (health, compliance and synthetic checks run once per service).
          Empty = single-image mode using image-ref/image-name and monitoring-url.
      image-ref:
        type: string
        default: ''
      registry:
        type: string
        default: ghcr.io
      image-owner:
        type: string
        default: ''
      image-name:
        type: string
        default: ''
      image-tag:
        type: string
        default: ''
      monitoring-url:
        type: string
        default: 'http://localhost/health'
        description: 'Single-image mode only; in multi-image mode use health-url per images entry'
      check-interval:
        type: string
        default: '60'
        description: 'Check interval in seconds'
      max-checks:
        type: string
        default: '3'
        description: 'Number of checks to perform'
      sbom-file:
        type: string
        default: ''
    secrets:
      API_KEY:
        required: false

jobs:
  # Lists what to monitor. Only names and URLs are passed on: job outputs holding registry owners
  # can be dropped by Actions when they match a secret, so image references are built inside each job.
  resolve:
    runs-on: ubuntu-latest
    name: Resolve monitored services
    outputs:
      services: ${{ steps.resolve.outputs.services }}
    steps:
      - id: resolve
        shell: bash
        env:
          IMAGES_INPUT: ${{ inputs.images }}
          IMAGE_NAME: ${{ inputs.image-name }}
          MONITORING_URL: ${{ inputs.monitoring-url }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          if [ -n "$IMAGES_INPUT" ]; then
            services=$(printf '%s' "$IMAGES_INPUT" | jq -c '
              if type != "array" then error("images must be a JSON array") else . end
              | map(select((.role // "batch") == "service")
                  | ((.name // "") | ascii_downcase) as $name
                  | if ($name | test("^[a-z0-9][a-z0-9._-]*$")) | not then error("invalid image name: \"" + $name + "\"") else . end
                  | if (.["health-url"] // "") == "" then error("service image " + $name + " needs a health-url") else . end
                  | {name: $name, key: ($name | ascii_upcase | gsub("[^A-Z0-9]"; "_")), url: .["health-url"]})
              | if length == 0 then error("images contains no role=service entry") else . end
              | if (map(.name) | unique | length) != length then error("image names must be unique") else . end')
          else
            name=$(printf '%s' "${IMAGE_NAME:-$REPO_NAME}" | tr '[:upper:]' '[:lower:]')
            services=$(jq -cn --arg name "$name" --arg url "$MONITORING_URL" \
              '[{name: $name, key: ($name | ascii_upcase | gsub("[^A-Z0-9]"; "_")), url: $url}]')
          fi
          echo "services=$services" >> "$GITHUB_OUTPUT"
          printf '%s' "$services" | jq -r '.[] | "  - \(.name): \(.url)"'

  health-monitoring:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.resolve.outputs.services) }}
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    name: Runtime Health Monitoring (${{ matrix.service.name }})
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Resolve image references
        id: resolve-image
        shell: bash
        env:
          IMAGES_INPUT: ''
          IMAGE_REF: ${{ inputs.images == '' && inputs.image-ref || '' }}
          IMAGE_NAME: ${{ matrix.service.name }}
          IMAGE_OWNER: ${{ inputs.image-owner }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          REGISTRY: ${{ inputs.registry }}
          COMPOSE_SERVICE: app
          HEALTH_URL: ${{ matrix.service.url }}
          REQUIRE_HEALTH: 'false'
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          registry=$(lower "$REGISTRY")
          owner="$IMAGE_OWNER"
          if [ -z "$owner" ] && [ "$registry" = 'ghcr.io' ]; then
            owner="$REPO_OWNER"
          fi
          owner=$(lower "$owner")
          tag="${IMAGE_TAG:-$SHA}"

          if [ -n "$IMAGES_INPUT" ]; then
            # Multi-image mode: every role=service entry becomes one deployable service.
            services=$(printf '%s' "$IMAGES_INPUT" | jq -c \
              --arg registry "$registry" --arg owner "$owner" --arg tag "$tag" --arg require_health "$REQUIRE_HEALTH" '
              if type != "array" then error("images must be a JSON array") else . end
              | map(select((.role // "batch") == "service")
                  | ((.name // "") | ascii_downcase) as $name
                  | if ($name | test("^[a-z0-9][a-z0-9._-]*$")) | not then error("invalid image name: \"" + $name + "\"") else . end
                  | {
                      name: $name,
                      key: ($name | ascii_upcase | gsub("[^A-Z0-9]"; "_")),
                      ref: ($registry + "/" + (if $owner != "" then $owner + "/" else "" end) + $name + ":" + $tag),
                      registry: $registry,
                      service: (.["compose-service"] // $name),
                      health: (.["health-url"] // "")
                    }
                  | if $require_health == "true" and .health == "" then error("service image " + .name + " needs a health-url") else . end)
              | if length == 0 then error("images contains no role=service entry") else . end
              | if (map(.name) | unique | length) != length then error("image names must be unique") else . end')
          else
            # Single-image mode: one service, exactly as before.
            if [ -n "$IMAGE_REF" ]; then
              image_ref="$IMAGE_REF"
              registry=$(lower "${image_ref%%/*}")
            else
              image_name=$(lower "${IMAGE_NAME:-$REPO_NAME}")
              image_path="$image_name"
              if [ -n "$owner" ]; then
                image_path="${owner}/$image_name"
              fi
              image_ref="${registry}/${image_path}:${tag}"
            fi
            services=$(jq -cn --arg name "$(lower "${IMAGE_NAME:-$REPO_NAME}")" --arg ref "$image_ref" --arg registry "$registry" \
              --arg service "$COMPOSE_SERVICE" --arg health "$HEALTH_URL" \
              '[{name: $name, key: ($name | ascii_upcase | gsub("[^A-Z0-9]"; "_")), ref: $ref, registry: $registry, service: $service, health: $health}]')
          fi

          {
            echo "services=$services"
            echo "ghcr=$(printf '%s' "$services" | jq 'any(.[]; .registry == "ghcr.io")')"
            # First service's ref; keeps single-image consumers working (outputs may be dropped if they match a secret).
            echo "image-ref=$(printf '%s' "$services" | jq -r '.[0].ref')"
          } >> "$GITHUB_OUTPUT"
          printf '%s' "$services" | jq -r '.[] | "  - \(.name) -> \(.ref) (compose service: \(.service))"'

      - name: Perform health checks
        id: health
        shell: bash
        run: |
          set -euo pipefail

          url='${{ matrix.service.url }}'
          max_checks=${{ inputs.max-checks }}
          interval=${{ inputs.check-interval }}
          check_count=0
          failed_checks=0

          echo "Starting health monitoring of ${url}..."
          echo "Parameters: ${max_checks} checks with ${interval}s interval"
          echo ""

          for i in $(seq 1 "$max_checks"); do
            timestamp=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
            response_code=$(curl -sw '%{http_code}' -o /dev/null "$url" 2>/dev/null || echo '000')
            response_time=$(curl -sw '%{time_total}' -o /dev/null "$url" 2>/dev/null || echo '0')

            status='✓'
            if [ "$response_code" -ge 200 ] && [ "$response_code" -lt 400 ]; then
              status='✓'
            else
              status='✗'
              failed_checks=$((failed_checks + 1))
            fi

            echo "[$timestamp] Check $i/$max_checks: HTTP $response_code | ${response_time}s | $status"

            if [ "$i" -lt "$max_checks" ]; then
              sleep "$interval"
            fi
          done

          echo ""
          echo "Summary: $((max_checks - failed_checks))/$max_checks checks passed"

          if [ "$failed_checks" -gt 0 ]; then
            echo "failed_checks=$failed_checks" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate monitoring report
        shell: bash
        run: |
          cat > monitoring-report.md << 'EOF'
          # Runtime Monitoring Report

          **Image**: ${{ steps.resolve-image.outputs.image-ref }}
          **URL**: ${{ matrix.service.url }}
          **Timestamp**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          ## Health Checks
          - Total checks: ${{ inputs.max-checks }}
          - Interval: ${{ inputs.check-interval }}s
          - Status: ✓ Passed

          ## Metrics
          - Response time: < 1s (target)
          - Availability: 100%
          - Error rate: 0%

          ## Endpoints Monitored
          - `${{ matrix.service.url }}`

          ## Alerts
          None

          ## Recommendations
          - Monitor response times for performance trends
          - Configure alerting for availability < 99.9%
          - Review application logs for warnings
          EOF

          cat monitoring-report.md

      - name: Upload monitoring report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: monitoring-report-${{ matrix.service.key }}
          path: monitoring-report.md
          retention-days: 30

  compliance-check:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.resolve.outputs.services) }}
    runs-on: ubuntu-latest
    name: Container Compliance Check (${{ matrix.service.name }})
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Resolve image references
        id: resolve-image
        shell: bash
        env:
          IMAGES_INPUT: ''
          IMAGE_REF: ${{ inputs.images == '' && inputs.image-ref || '' }}
          IMAGE_NAME: ${{ matrix.service.name }}
          IMAGE_OWNER: ${{ inputs.image-owner }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          REGISTRY: ${{ inputs.registry }}
          COMPOSE_SERVICE: app
          HEALTH_URL: ${{ matrix.service.url }}
          REQUIRE_HEALTH: 'false'
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          registry=$(lower "$REGISTRY")
          owner="$IMAGE_OWNER"
          if [ -z "$owner" ] && [ "$registry" = 'ghcr.io' ]; then
            owner="$REPO_OWNER"
          fi
          owner=$(lower "$owner")
          tag="${IMAGE_TAG:-$SHA}"

          if [ -n "$IMAGES_INPUT" ]; then
            # Multi-image mode: every role=service entry becomes one deployable service.
            services=$(printf '%s' "$IMAGES_INPUT" | jq -c \
              --arg registry "$registry" --arg owner "$owner" --arg tag "$tag" --arg require_health "$REQUIRE_HEALTH" '
              if type != "array" then error("images must be a JSON array") else . end
              | map(select((.role // "batch") == "service")
                  | ((.name // "") | ascii_downcase) as $name
                  | if ($name | test("^[a-z0-9][a-z0-9._-]*$")) | not then error("invalid image name: \"" + $name + "\"") else . end
                  | {
                      name: $name,
                      key: ($name | ascii_upcase | gsub("[^A-Z0-9]"; "_")),
                      ref: ($registry + "/" + (if $owner != "" then $owner + "/" else "" end) + $name + ":" + $tag),
                      registry: $registry,
                      service: (.["compose-service"] // $name),
                      health: (.["health-url"] // "")
                    }
                  | if $require_health == "true" and .health == "" then error("service image " + .name + " needs a health-url") else . end)
              | if length == 0 then error("images contains no role=service entry") else . end
              | if (map(.name) | unique | length) != length then error("image names must be unique") else . end')
          else
            # Single-image mode: one service, exactly as before.
            if [ -n "$IMAGE_REF" ]; then
              image_ref="$IMAGE_REF"
              registry=$(lower "${image_ref%%/*}")
            else
              image_name=$(lower "${IMAGE_NAME:-$REPO_NAME}")
              image_path="$image_name"
              if [ -n "$owner" ]; then
                image_path="${owner}/$image_name"
              fi
              image_ref="${registry}/${image_path}:${tag}"
            fi
            services=$(jq -cn --arg name "$(lower "${IMAGE_NAME:-$REPO_NAME}")" --arg ref "$image_ref" --arg registry "$registry" \
              --arg service "$COMPOSE_SERVICE" --arg health "$HEALTH_URL" \
              '[{name: $name, key: ($name | ascii_upcase | gsub("[^A-Z0-9]"; "_")), ref: $ref, registry: $registry, service: $service, health: $health}]')
          fi

          {
            echo "services=$services"
            echo "ghcr=$(printf '%s' "$services" | jq 'any(.[]; .registry == "ghcr.io")')"
            # First service's ref; keeps single-image consumers working (outputs may be dropped if they match a secret).
            echo "image-ref=$(printf '%s' "$services" | jq -r '.[0].ref')"
          } >> "$GITHUB_OUTPUT"
          printf '%s' "$services" | jq -r '.[] | "  - \(.name) -> \(.ref) (compose service: \(.service))"'

      - name: Login to GHCR (for private images)
        if: ${{ steps.resolve-image.outputs.ghcr == 'true' }}
        shell: bash
        run: echo '${{ github.token }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Verify image metadata
        shell: bash
        run: |
          set -euo pipefail
          image_ref='${{ steps.resolve-image.outputs.image-ref }}'

          echo "Checking container compliance..."
          echo "Image: $image_ref"
          echo ""

          # Pull image and inspect metadata
          docker pull "$image_ref" >/dev/null 2>&1 || {
            echo "⚠ Warning: Could not pull image for inspection"
            exit 0
          }

          echo "Image Metadata:"
          docker inspect "$image_ref" | jq -r '.[0] | {
            Id: .Id,
            Architecture: .Architecture,
            Os: .Os,
            Created: .Created,
            Size: .Size,
            RepoTags: .RepoTags,
            RepoDigests: .RepoDigests
          }' || echo "Inspection failed"

      - name: SBOM verification
        if: ${{ inputs.sbom-file != '' }}
        shell: bash
        run: |
          set -euo pipefail

          sbom_file='${{ inputs.sbom-file }}'

          if [ -f "$sbom_file" ]; then
            echo "Verifying SBOM: $sbom_file"

            # Basic SBOM validation
            if jq empty "$sbom_file" 2>/dev/null; then
              echo "✓ SBOM is valid JSON"

              component_count=$(jq '.components | length' "$sbom_file" || echo 0)
              echo "✓ SBOM contains $component_count components"
            else
              echo "✗ SBOM is invalid"
              exit 1
            fi
          else
            echo "⚠ SBOM file not found: $sbom_file (skipping verification)"
          fi

  synthetic-tests:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.resolve.outputs.services) }}
    runs-on: ubuntu-latest
    name: Synthetic Tests (${{ matrix.service.name }})
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Run synthetic tests
        shell: bash
        run: |
          set -euo pipefail

          url='${{ matrix.service.url }}'

          echo "Running synthetic tests against $url"
          echo ""

          # Test 1: Basic connectivity
          echo "[Test 1] Basic connectivity..."
          if curl -sf "$url" >/dev/null 2>&1; then
            echo "  ✓ Service is reachable"
          else
            echo "  ✗ Service is not reachable"
            exit 1
          fi

          # Test 2: Response time SLA (target: < 1s)
          echo "[Test 2] Response time SLA..."
          response_time=$(curl -sw '%{time_total}' -o /dev/null "$url" 2>/dev/null || echo '0')
          echo "  Response time: ${response_time}s (target: < 1.0s)"
          if (( $(echo "$response_time < 1.0" | bc -l) )); then
            echo "  ✓ SLA met"
          else
            echo "  ⚠ SLA not met (non-blocking)"
          fi

          # Test 3: HTTP headers
          echo "[Test 3] Security headers..."
          headers=$(curl -si "$url" 2>/dev/null | head -20)
          echo "$headers" | grep -qi 'content-type' && echo "  ✓ Content-Type present" || echo "  ⚠ Content-Type missing"
          echo "$headers" | grep -qi 'x-content-type-options' && echo "  ✓ X-Content-Type-Options present" || echo "  ⚠ X-Content-Type-Options missing"

          echo ""
          echo "✓ Synthetic tests completed"

  summary:
    runs-on: ubuntu-latest
    needs: [resolve, health-monitoring, compliance-check, synthetic-tests]
    if: always()
    name: Monitoring Summary
    steps:

      - name: Generate monitoring summary
        shell: bash
        env:
          SERVICES: ${{ needs.resolve.outputs.services }}
        run: |
          set -euo pipefail

          echo "# Continuous Monitoring Summary"
          echo ""
          echo "**Services**:"
          jq -r '.[] | "- \(.name): \(.url)"' <<< "$SERVICES"
          echo "**Report Time**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "## Results"
          echo "- Health Monitoring: ${{ needs.health-monitoring.result }}"
          echo "- Compliance Check: ${{ needs.compliance-check.result }}"
          echo "- Synthetic Tests: ${{ needs.synthetic-tests.result }}"
          echo ""
          echo "## Recommendations"
          echo "- Continue monitoring for anomalies"
          echo "- Review logs for warnings and errors"
          echo "- Track performance trends over time"
          echo "- Update alerting thresholds based on observed patterns"
