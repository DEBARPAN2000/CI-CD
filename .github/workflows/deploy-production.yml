name: Reusable Deploy Production

on:
  workflow_call:
    inputs:
      image-ref:
        type: string
        default: ''
      registry:
        type: string
        default: ghcr.io
      image-owner:
        type: string
        default: ''
      image-name:
        type: string
        default: ''
      image-tag:
        type: string
        default: ''
      environment-name:
        type: string
        default: production
      compose-file:
        type: string
        default: docker-compose.yml
      compose-service:
        type: string
        default: app
      health-check-url:
        type: string
        default: http://localhost/health
      health-check-max-retries:
        type: string
        default: '30'
      health-check-delay:
        type: string
        default: '10'
      tls-cert:
        type: boolean
        default: false
        description: 'Generate ./certs/{cert,key}.pem for compose files that mount them (HTTPS apps)'

permissions:
  contents: read
  packages: read
jobs:
  pre-deploy-check:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Resolve image reference
        id: resolve-image
        shell: bash
        run: |
          set -euo pipefail
          image_ref='${{ inputs.image-ref }}'
          if [ -z "$image_ref" ]; then
            image_name='${{ inputs.image-name }}'
            if [ -z "$image_name" ]; then
              image_name='${{ github.event.repository.name }}'
            fi
            image_tag='${{ inputs.image-tag }}'
            if [ -z "$image_tag" ]; then
              image_tag='${{ github.sha }}'
            fi
            registry='${{ inputs.registry }}'
            registry=$(printf '%s' "$registry" | tr '[:upper:]' '[:lower:]')
            if [ "$registry" = 'ghcr.io' ]; then
              image_name=$(printf '%s' "$image_name" | tr '[:upper:]' '[:lower:]')
            fi
            image_owner='${{ inputs.image-owner }}'
            if [ -z "$image_owner" ] && [ "$registry" = 'ghcr.io' ]; then
              image_owner='${{ github.repository_owner }}'
            fi
            if [ "$registry" = 'ghcr.io' ]; then
              image_owner=$(printf '%s' "$image_owner" | tr '[:upper:]' '[:lower:]')
            fi
            image_name=$(printf '%s' "$image_name" | tr '[:upper:]' '[:lower:]')
            image_owner=$(printf '%s' "$image_owner" | tr '[:upper:]' '[:lower:]')
            image_path="$image_name"
            if [ -n "$image_owner" ]; then
              image_path="${image_owner}/$image_name"
            fi
            image_ref="${registry}/${image_path}:$image_tag"
          else
            registry="${image_ref%%/*}"
            registry=$(printf '%s' "$registry" | tr '[:upper:]' '[:lower:]')
          fi
          echo "image-ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR (for private images)
        if: ${{ steps.resolve-image.outputs.registry == 'ghcr.io' }}
        shell: bash
        run: echo '${{ github.token }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Verify image exists in registry
        shell: bash
        run: |
          set -euo pipefail
          image_ref='${{ steps.resolve-image.outputs.image-ref }}'
          echo "Verifying image: ${image_ref}"

          # Use docker to check if image exists
          docker manifest inspect "${image_ref}" >/dev/null 2>&1 || exit 1
          echo "✓ Image verified in registry"

      - name: Verify deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          compose_file='${{ inputs.compose-file }}'

          if [ ! -f "$compose_file" ]; then
            echo "ERROR: Compose file not found: $compose_file" >&2
            exit 1
          fi

          echo "✓ Deployment configuration verified"

  deploy:
    needs: pre-deploy-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      packages: read
    environment: ${{ inputs.environment-name }}
    name: Deploy to Production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Resolve image reference
        id: resolve-image
        shell: bash
        run: |
          set -euo pipefail
          image_ref='${{ inputs.image-ref }}'
          if [ -z "$image_ref" ]; then
            image_name='${{ inputs.image-name }}'
            if [ -z "$image_name" ]; then
              image_name='${{ github.event.repository.name }}'
            fi
            image_tag='${{ inputs.image-tag }}'
            if [ -z "$image_tag" ]; then
              image_tag='${{ github.sha }}'
            fi
            registry='${{ inputs.registry }}'
            registry=$(printf '%s' "$registry" | tr '[:upper:]' '[:lower:]')
            if [ "$registry" = 'ghcr.io' ]; then
              image_name=$(printf '%s' "$image_name" | tr '[:upper:]' '[:lower:]')
            fi
            image_owner='${{ inputs.image-owner }}'
            if [ -z "$image_owner" ] && [ "$registry" = 'ghcr.io' ]; then
              image_owner='${{ github.repository_owner }}'
            fi
            if [ "$registry" = 'ghcr.io' ]; then
              image_owner=$(printf '%s' "$image_owner" | tr '[:upper:]' '[:lower:]')
            fi
            image_path="$image_name"
            if [ -n "$image_owner" ]; then
              image_path="${image_owner}/$image_name"
            fi
            image_ref="${registry}/${image_path}:$image_tag"
          else
            registry="${image_ref%%/*}"
            registry=$(printf '%s' "$registry" | tr '[:upper:]' '[:lower:]')
          fi
          echo "image-ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR (for private images)
        if: ${{ steps.resolve-image.outputs.registry == 'ghcr.io' }}
        shell: bash
        run: echo '${{ github.token }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Create deployment record
        shell: bash
        run: |
          echo "Deployment initiated at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Image: ${{ steps.resolve-image.outputs.image-ref }}"
          echo "Environment: ${{ inputs.environment-name }}"

      - name: Pull image
        shell: bash
        run: |
          set -euo pipefail
          docker pull '${{ steps.resolve-image.outputs.image-ref }}'
          echo "✓ Image pulled successfully"

      - name: Backup current deployment
        shell: bash
        run: |
          set -euo pipefail
          compose_file='${{ inputs.compose-file }}'
          compose_service='${{ inputs.compose-service }}'

          # Export current container state for rollback
          docker compose -f "$compose_file" ps "$compose_service" > /tmp/pre-deploy-state.log 2>&1 || true
          previous_container_id="$(docker compose -f "$compose_file" ps -q "$compose_service" 2>/dev/null || true)"
          if [ -n "$previous_container_id" ]; then
            previous_image_ref="$(docker inspect --format='{{.Config.Image}}' "$previous_container_id" 2>/dev/null || true)"
            if [ -n "$previous_image_ref" ]; then
              printf '%s\n' "$previous_image_ref" > /tmp/pre-deploy-image-ref
              echo "Captured previous image reference: $previous_image_ref"
            fi
          fi
          echo "✓ Current deployment state backed up"

      - name: Create local TLS certificate
        if: ${{ inputs.tls-cert }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p certs
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 -keyout certs/key.pem -out certs/cert.pem \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          # container runs as a non-root user; the certs are throwaway, so make them world-readable
          chmod 644 certs/key.pem certs/cert.pem

      - name: Deploy via Docker Compose
        shell: bash
        run: |
          set -euo pipefail
          export IMAGE_REF='${{ steps.resolve-image.outputs.image-ref }}'
          compose_file='${{ inputs.compose-file }}'
          compose_service='${{ inputs.compose-service }}'

          echo "Deploying ${compose_service}..."
          docker compose -f "$compose_file" pull
          docker compose -f "$compose_file" down
          docker compose -f "$compose_file" up -d "$compose_service"

          echo "✓ Deployment complete"

      - name: Wait for health check
        shell: bash
        run: |
          set -euo pipefail
          max_retries=${{ inputs.health-check-max-retries }}
          delay=${{ inputs.health-check-delay }}
          url='${{ inputs.health-check-url }}'

          echo "Waiting for application health check..."
          for i in $(seq 1 "$max_retries"); do
            if curl -ksf "$url" >/dev/null 2>&1; then
              echo "✓ Health check passed on attempt $i"
              exit 0
            fi
            if [ "$i" -lt "$max_retries" ]; then
              echo "  [${i}/${max_retries}] Retrying in ${delay}s..."
              sleep "$delay"
            fi
          done

          echo "✗ Health check failed after ${max_retries} attempts" >&2
          echo ""
          echo "Application logs:"
          docker compose -f '${{ inputs.compose-file }}' logs '${{ inputs.compose-service }}' || true
          exit 1

      - name: Run smoke tests
        shell: bash
        run: |
          set -euo pipefail
          endpoints=(/health /api/status)

          base_url='${{ inputs.health-check-url }}'
          base_url="${base_url%/health}"

          echo "Running smoke tests..."
          for endpoint in "${endpoints[@]}"; do
            response_code=$(curl -ksw '%{http_code}' -o /dev/null "${base_url}${endpoint}" 2>/dev/null || echo '000')
            if [ "$response_code" -ge 200 ] && [ "$response_code" -lt 400 ]; then
              echo "  ✓ ${endpoint}: HTTP $response_code"
            else
              echo "  ⚠ ${endpoint}: HTTP $response_code (non-critical)"
            fi
          done

      - name: Post-deployment verification
        shell: bash
        run: |
          docker compose -f '${{ inputs.compose-file }}' ps
          echo ""
          echo "✓ Production deployment successful"
          echo "  Image: ${{ steps.resolve-image.outputs.image-ref }}"
          echo "  Time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

      - name: Rollback on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          echo "Deployment failed, initiating rollback..."
          compose_file='${{ inputs.compose-file }}'
          compose_service='${{ inputs.compose-service }}'

          echo "Restoring previous deployment state..."
          previous_image_ref="$(cat /tmp/pre-deploy-image-ref 2>/dev/null || true)"
          if [ -n "$previous_image_ref" ]; then
            echo "Rolling back to image: $previous_image_ref"
            export IMAGE_REF="$previous_image_ref"
          else
            echo "No captured previous image reference found; rolling back using compose defaults."
          fi
          docker compose -f "$compose_file" down || true
          docker compose -f "$compose_file" up -d "$compose_service" || true

          echo "⚠ Rollback attempted. Manual verification required."
          exit 1
